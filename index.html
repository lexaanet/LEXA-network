<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LEXA Network</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#030b1f;color:#fff;font-family:'Space Grotesk',sans-serif}
.container{max-width:430px;margin:auto;padding:18px}
.hero{padding:22px;border-radius:30px;background:linear-gradient(135deg,#0ea5e9,#4f46e5,#06b6d4);margin-top:15px}
.logo{font-family:'Orbitron',sans-serif;font-size:32px}
.live{display:inline-block;padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.2)}
.balance{font-size:46px;font-weight:700;margin:15px 0}
.stats{display:flex;gap:12px;margin-top:16px}
.stat{flex:1;background:rgba(0,0,0,.15);padding:14px;border-radius:18px;text-align:center}
.btn{width:100%;padding:18px;border:none;border-radius:20px;margin-top:18px;font-weight:700}
.card{background:#08142d;border:1px solid rgba(255,255,255,.08);padding:18px;border-radius:22px;margin-top:16px}
.task{display:flex;justify-content:space-between;padding:10px 0}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:auto;background:#061127;padding:14px;display:flex;justify-content:space-around}
.spacer{height:90px}
</style>
</head>
<body>
<div class="container">
<div class="logo">LEXA</div>
<div>Contribution Creates Value</div>

<div class="hero">
<div class="live">● LIVE</div>
<div class="balance">12,450</div>
<div>LEXA NETWORK</div>

<div class="stats">
<div class="stat"><div>RATE</div><b>50/H</b></div>
<div class="stat"><div>STATUS</div><b>READY</b></div>
</div>

<button class="btn">⛏ START MINING</button>
</div>

<div class="card">
<h3>🎁 Daily Missions</h3>
<div class="task"><span>📘 Follow Facebook</span><b>+50</b></div>
<div class="task"><span>✈️ Join Telegram</span><b>+100</b></div>
<div class="task"><span>𝕏 Follow X</span><b>+100</b></div>
<div class="task"><span>💬 Join Discord</span><b>+100</b></div>
</div>

<div class="card">
<h3>👥 Referral Team</h3>
<p>0 Active Referrals</p>
</div>

<div class="spacer"></div>
</div>

<div class="nav">
<div>🏠<br>Home</div>
<div>🎯<br>Missions</div>
<div>👥<br>Team</div>
<div>💰<br>Wallet</div>
<div>👤<br>Profile</div>
</div>
</body>
</html>
